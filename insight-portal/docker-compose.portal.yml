# insight-portal overlay.
#
# Scoped to the SAME compose project as the rest of the stack, per contract 04 section 1 option A:
#
#   docker compose -p odoo19-bct -f insight-portal/docker-compose.portal.yml up -d --build
#
# It joins the existing `odoo19-bct_bct` network as an external network, so service names resolve
# and nothing here can reach odoo19-platform-*, odoo19-analytics-* or smart-warga-*. This host runs
# all three, and every one of them stays untouched by anything in this file. There is no `down`
# target here on purpose: a `docker compose down` that resolved to the wrong project is how a volume
# was lost earlier in this build.
#
# The file lives inside insight-portal/ because that is the path this agent owns. Promoting it to a
# root-level overlay is Platform-Infra's call, not this file's.

services:
  insight-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: odoo19-bct-insight-portal:local
    container_name: odoo19-bct-insight-portal
    restart: unless-stopped
    # 127.0.0.1 only. Never 0.0.0.0 - contract 04 section 4.
    ports:
      - "127.0.0.1:${INSIGHT_PORTAL_HOST_PORT:-33000}:3000"
    environment:
      # In-network service names, not host ports: the portal talks to the gateway and the semantic
      # API over the compose network, and neither needs to be published for it to work.
      INSIGHT_PORTAL_SEMANTIC_API_URL: http://odoo19-bct-semantic-api:8080
      INSIGHT_PORTAL_LOGIN_GATEWAY_URL: http://odoo19-bct-login-gateway:8080
      INSIGHT_PORTAL_JWKS_URL: http://odoo19-bct-login-gateway:8080/.well-known/jwks.json
      INSIGHT_PORTAL_JWT_ISSUER: ${LOGIN_GATEWAY_JWT_ISSUER:-https://login-gateway.local/}
      INSIGHT_PORTAL_JWT_AUDIENCE: ${LOGIN_GATEWAY_JWT_AUDIENCE:-insight-portal}
      INSIGHT_PORTAL_ODOO_DB: ${ODOO_DB_NAME:-bct}
      # Plain HTTP on a loopback port in development. Set to true behind TLS; the cookie is
      # httpOnly and SameSite=Strict either way.
      INSIGHT_PORTAL_COOKIE_SECURE: ${INSIGHT_PORTAL_COOKIE_SECURE:-false}
      INSIGHT_PORTAL_REQUEST_TIMEOUT_MS: ${INSIGHT_PORTAL_REQUEST_TIMEOUT_MS:-8000}
      INSIGHT_PORTAL_CACHE_TTL_SECONDS: ${INSIGHT_PORTAL_CACHE_TTL_SECONDS:-30}
      TZ: ${TZ:-Asia/Jakarta}
    # No secret of any kind is passed to this service. It holds no database DSN, no signing key and
    # no salt, because it needs none: it authenticates users through the gateway and reads figures
    # through the semantic API.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Next writes nothing at runtime except what the OS needs; /tmp is given explicitly so the
      # root filesystem can stay read-only.
      - /tmp:size=16m,mode=1777
    user: "10004:10004"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # Measured idle at well under this; the limit exists so a runaway render cannot take the
          # 4 GiB budget from Odoo (contract 04 section 10).
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bct

networks:
  bct:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}_bct
