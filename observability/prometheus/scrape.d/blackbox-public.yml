# ---------------------------------------------------------------------------
# Public-edge probes. Owner: Platform-Infra.
#
# WHY THIS EXISTS SEPARATELY FROM blackbox-scrape.yml. That file probes services
# by name on the compose network, which proves the applications are alive and
# proves nothing about DNS, TLS or the reverse proxy. A certificate that expired
# or a DNS record that moved would leave that board entirely green while every
# client saw nothing. This file goes out over the real internet path instead.
#
# NO HOSTNAME APPEARS HERE, and that is the point of the indirection. The
# targets are generated by scripts/render-probe-targets.py from the one place
# the domain is already configured, into a file git ignores. The logic is
# reviewable and tracked; the production hostnames are not written into a
# repository that is mirrored publicly.
#
# The generated file is `.json` ON PURPOSE: `prometheus.yml` globs
# `scrape.d/*.yml` as full scrape configs, so a `.yml` name here would be parsed
# as one and rejected. The extension separates the two kinds of file without
# needing another mount.
#
# The blackbox module travels as a LABEL on each target rather than as a job
# parameter, because the surfaces do not share an expected status: three answer
# 200 and the ERP hostname answers 401 at the edge, which is its healthy
# response. One job, per-target expectations.
# ---------------------------------------------------------------------------
scrape_configs:

  - job_name: blackbox-public
    # Slower than the internal probes: this leaves the machine, and hammering
    # the public edge to notice an outage twenty seconds sooner is not a trade
    # worth making.
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/scrape.d/public-targets.json
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      # Per-target module, carried as a label by the generated file.
      - source_labels: [module]
        target_label: __param_module
      - regex: module
        action: labeldrop
      - target_label: __address__
        replacement: blackbox-exporter:9115
