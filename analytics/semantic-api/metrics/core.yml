- name: ppob_transaction_count
  label: "Jumlah Transaksi PPOB"
  description: >-
    Count of PPOB transactions. The 60-second SLA is the tightest in the platform because PPOB is
    operational: an SLA breach is the point of the view, not an inconvenience (ADR 0001).
  grain: [date_day, tenant_id, operating_unit_id]
  dimensions:
    - date_day
    - date_month
    - tenant_id
    - operating_unit_id
    - biller_key
    - biller_code
    - biller_category
    - state
  derived_dimensions:
    date_month: {from: date_day, grain: month}
  filters:
    date_range: {type: daterange, required: true, column: date_day}
    operating_unit_id: {type: "int[]", required: false}
    state: {type: "string[]", required: false}
    biller_code: {type: "string[]", required: false}
  type: count
  aggregation: sum
  source_model: mart_ppob_transaction
  measure: transaction_count
  refresh_sla_seconds: 60
  pdp_class: internal

- name: ppob_sla_breach_count
  label: "Pelanggaran SLA PPOB"
  description: "PPOB transactions that breached their biller SLA."
  grain: [date_day, tenant_id, operating_unit_id]
  dimensions:
    - date_day
    - date_month
    - tenant_id
    - operating_unit_id
    - biller_key
    - biller_code
    - state
  derived_dimensions:
    date_month: {from: date_day, grain: month}
  filters:
    date_range: {type: daterange, required: true, column: date_day}
    operating_unit_id: {type: "int[]", required: false}
    biller_code: {type: "string[]", required: false}
  type: count
  aggregation: sum
  source_model: mart_ppob_transaction
  measure: sla_breach_count
  refresh_sla_seconds: 60
  pdp_class: internal

- name: ppob_commission_revenue
  label: "Pendapatan Komisi PPOB"
  description: >-
    Commission earned on PPOB transactions. This is the ONLY PPOB revenue measure. The much larger
    pass_through_amount on the same mart is money owed to the biller — it is not revenue, and the
    registry refuses any metric that sums it as an IDR amount.
  grain: [date_day, tenant_id, operating_unit_id]
  dimensions:
    - date_day
    - date_month
    - tenant_id
    - operating_unit_id
    - biller_key
    - biller_code
    - biller_category
  derived_dimensions:
    date_month: {from: date_day, grain: month}
  filters:
    date_range: {type: daterange, required: true, column: date_day}
    operating_unit_id: {type: "int[]", required: false}
    biller_code: {type: "string[]", required: false}
  type: decimal
  unit: IDR
  aggregation: sum
  source_model: mart_ppob_transaction
  measure: commission_revenue
  refresh_sla_seconds: 60
  pdp_class: internal

# mart_stock_position is a POSITION, not a daily series: it carries no date_day column, so it has
# no date_range filter and no date dimensions. Declaring one would have produced a metric that
# fails at query time rather than at load time.
- name: stock_net_quantity
  label: "Posisi Stok"
  description: "Net quantity moved (in minus out) by product and operating unit."
  grain: [tenant_id, operating_unit_id, product_key]
  dimensions:
    - tenant_id
    - operating_unit_id
    - product_key
    - product_id
    - company_id
  filters:
    operating_unit_id: {type: "int[]", required: false}
    product_key: {type: "string[]", required: false}
  type: decimal
  unit: unit
  aggregation: sum
  source_model: mart_stock_position
  measure: net_qty
  refresh_sla_seconds: 300
  pdp_class: internal
