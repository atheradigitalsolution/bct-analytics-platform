# Metric definitions — frozen contract 03. Validated against metric.schema.json at startup and CI.
#
# BOUND against the real marts published in contract 05 section C (9070c2b) and verified column by
# column against the live warehouse, not against the contract text. Every `source_model`, `measure`
# and dimension below was read out of `information_schema` on the built models.
#
# `source_model` binds to the `mart_*` models, not the `fct_*` facts, per the Lead's instruction.
#
# Three traps DWH flagged, and what was done about each:
#
#  1. PPOB revenue is `commission_revenue`, NEVER `pass_through_amount`. The pass-through is money
#     owed to the biller — it is not ours and it is not revenue. Measured on live data, binding the
#     wrong column overstates revenue by 481x. registry.py now REFUSES to load any metric that sums
#     a `pass_through_*` column as an IDR amount, because a 481x error is not something a reviewer
#     spots in a YAML diff.
#
#  2. `mart_revenue_daily` UNIONs three channels (invoice, pos, ppob_commission) rather than summing
#     them. Summing across the channel must be deliberate, so `channel_note` is now REQUIRED for any
#     metric reading that model. Credit notes are already netted off inside `invoice`; they are not
#     netted again here.
#
#  3. `operating_unit_id = -1` is the explicit UNASSIGNED member (dim_operating_unit.is_unassigned),
#     not a missing value. Verified: no mart carries a NULL operating_unit_id. The compiler's
#     empty-entitlement predicate is `= -1`, not `IS NULL` — see UNASSIGNED_OPERATING_UNIT_ID.

- name: revenue_net
  label: "Pendapatan Neto"
  description: >-
    Invoiced revenue excluding tax, with credit notes netted off, plus POS takings and PPOB
    commission. Summed across all three revenue channels.
  channel_note: >-
    mart_revenue_daily UNIONs revenue_channel in (invoice, pos, ppob_commission). Summing across
    all three is intended here: this is total net revenue. Credit notes are already netted off
    inside the invoice channel and are not netted again. Use the revenue_channel dimension to
    split by channel.
  grain: [date_day, tenant_id, operating_unit_id]
  dimensions:
    - date_day
    - date_month
    - tenant_id
    - operating_unit_id
    - partner_key
    - product_key
    - company_id
    - revenue_channel
  derived_dimensions:
    date_month: {from: date_day, grain: month}
  filters:
    date_range: {type: daterange, required: true, column: date_day}
    operating_unit_id: {type: "int[]", required: false}
    product_key: {type: "string[]", required: false}
    revenue_channel: {type: "string[]", required: false}
  type: decimal
  unit: IDR
  aggregation: sum
  source_model: mart_revenue_daily
  measure: revenue_net
  refresh_sla_seconds: 900
  pdp_class: internal

