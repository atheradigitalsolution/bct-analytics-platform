# =====================================================================================
# CI - lint, SAST, SCA, secrets and container scanning.
#
# SOLE OWNER: the Security agent (master prompt 2.1, restated in every Phase 1 brief).
# No other agent edits this file. QA sends a diff request for test jobs and Security
# merges it. This is not territoriality: a workflow that anyone can edit is a workflow
# where anyone can delete the job that would have failed.
#
# THERE IS NO cd.yml. Deployment is Phase 5. A stub would be a deployment path nobody
# reviewed, sitting in the repository with `on: push` one edit away.
#
# PINNING
#   Every third-party action is pinned to a full 40-character commit SHA with its release
#   tag in a trailing comment. A tag is a movable pointer; `@v4` means "whatever the
#   maintainer, or whoever compromises the maintainer, points v4 at this morning".
#   Every scanner installed as a binary is pinned to a version AND verified against a
#   SHA-256 checksum recorded here, so a compromised release asset fails the download step
#   rather than scanning our code with a compromised scanner.
#   Runners are pinned to ubuntu-24.04, never ubuntu-latest: a runner image change must be
#   a commit, not a Tuesday.
#
# WHAT PHASE 5 CD WILL GATE ON
#   One required status check: `ci-gate`. It aggregates every job below and fails if any
#   of them failed or was cancelled. Adding a job automatically tightens the gate, and a
#   job that is removed shows up as a missing dependency rather than as a silent pass.
#   Full semantics: security/CI-CONTRACT.md.
#
# ADDING AN IMAGE OR A NODE SERVICE TO THE SCANS
#   You do not edit this file. Add one entry to security/scan-targets.yml; the matrices
#   below are generated from it. See security/CI-CONTRACT.md.
# =====================================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Least privilege at the workflow level. No job below needs more; if one ever does, it
# gets its own `permissions:` block rather than raising the ceiling for everything.
# `security-events: write` is deliberately absent - SARIF upload to code scanning needs
# Advanced Security, which this repository does not have. Reports are uploaded as
# artifacts instead, so no finding is lost.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

  # Scanner binaries: version + SHA-256 of the linux-amd64 release asset.
  # Verified against the upstream published checksum files on 2026-08-31.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
  OSV_SCANNER_VERSION: "2.5.1"
  OSV_SCANNER_SHA256: "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"
  CYCLONEDX_NPM_VERSION: "6.0.1"

jobs:
  # ===================================================================================
  # discover - build the scan matrices from security/scan-targets.yml.
  # This is what makes "register an image" a one-line change in a file the owning agent
  # can be given, instead of an edit to a workflow only one agent may touch.
  # ===================================================================================
  discover:
    name: discover scan targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.targets.outputs.images }}
      node: ${{ steps.targets.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Registry parser self-test
        run: python3 security/scan_targets.py --selftest

      - name: Coverage gate - nothing ships unscanned
        # Hard-fails on a Dockerfile or package.json that no scan job covers
        # (master prompt 5.2). This is the control that keeps the registry honest:
        # you cannot add an image to the repo without adding it to the scans.
        run: python3 security/scan_targets.py --check

      - name: Build matrices
        id: targets
        run: |
          set -euo pipefail
          {
            echo "images=$(python3 security/scan_targets.py --matrix images)"
            echo "node=$(python3 security/scan_targets.py --matrix node)"
          } >> "$GITHUB_OUTPUT"

      - name: Report coverage
        if: always()
        run: python3 security/scan_targets.py --summary >> "$GITHUB_STEP_SUMMARY"

  # ===================================================================================
  # lint - the same pre-commit hooks every agent runs locally. If this job and a local
  # `pre-commit run --all-files` ever disagree, the config is wrong, not the developer.
  # ===================================================================================
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pinned toolchain
        run: python -m pip install -r security/requirements-ci.txt

      - name: Ignore-policy audit
        # Every scanner suppression carries a reason and an unexpired date, or this fails.
        run: python3 security/check_ignore_policy.py

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  # ===================================================================================
  # sast - Semgrep.
  # Local rules block. Registry rules advise. A floating upstream ruleset that can turn
  # the merge path red without anyone committing anything is an availability risk on the
  # critical path, so its findings are uploaded and read, not enforced.
  # ===================================================================================
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned toolchain
        run: python -m pip install -r security/requirements-ci.txt

      - name: Validate rule syntax
        run: semgrep --validate --config .semgrep/ --metrics=off

      - name: Semgrep - project rules (blocking)
        run: |
          set -euo pipefail
          semgrep scan \
            --config .semgrep/ \
            --error \
            --metrics=off \
            --disable-version-check \
            --json --output semgrep-project.json \
            --text
          echo "### Semgrep project rules: no findings" >> "$GITHUB_STEP_SUMMARY"

      - name: Semgrep - registry rules (advisory, never blocking)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --metrics=off \
            --disable-version-check \
            --json --output semgrep-registry.json \
            --text || true
          echo "### Semgrep registry rules ran in advisory mode - see the artifact" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-reports
          path: semgrep-*.json
          if-no-files-found: warn
          retention-days: 30

  # ===================================================================================
  # sca-python - pip-audit plus a CycloneDX SBOM.
  # Audits the CI toolchain itself as well as any project requirements that exist, so the
  # tools that check our dependencies are themselves checked.
  # ===================================================================================
  sca-python:
    name: sca-python (pip-audit + SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned toolchain
        run: python -m pip install -r security/requirements-ci.txt

      - name: Enumerate Python dependency manifests
        id: manifests
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Tracked files only - an untracked requirements.txt is not something we ship.
          git ls-files \
            | grep -E '(^|/)requirements[^/]*\.txt$' \
            | grep -v '^security/requirements-ci\.txt$' > project-reqs.txt || true
          echo "Project requirement files found: $(wc -l < project-reqs.txt)"
          cat project-reqs.txt || true

      - name: pip-audit - CI toolchain
        run: pip-audit --strict --requirement security/requirements-ci.txt --desc

      - name: pip-audit - project requirements
        run: |
          set -euo pipefail
          if [ ! -s project-reqs.txt ]; then
            {
              echo "### sca-python: no project requirements files yet"
              echo ""
              echo "Audited the pinned CI toolchain only (\`security/requirements-ci.txt\`)."
              echo "Python dependency sets arrive with \`analytics/cdc\` and \`analytics/dbt\` in wave 3;"
              echo "they are registered as \`python_projects\` in \`security/scan-targets.yml\` and will be"
              echo "picked up here automatically. **Skipped, not silently passed.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r req; do
            echo "::group::pip-audit $req"
            pip-audit --strict --requirement "$req" --desc
            echo "::endgroup::"
          done < project-reqs.txt

      - name: CycloneDX SBOM
        run: |
          set -euo pipefail
          cyclonedx-py requirements security/requirements-ci.txt \
            --of JSON -o sbom/sbom-python-ci-toolchain.cdx.json
          if [ -s project-reqs.txt ]; then
            while read -r req; do
              slug="$(echo "$req" | tr '/.' '--')"
              cyclonedx-py requirements "$req" \
                --of JSON -o "sbom/sbom-python-${slug}.cdx.json"
            done < project-reqs.txt
          fi
          ls -la sbom/

      - name: Upload Python SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python
          path: sbom/
          if-no-files-found: warn
          retention-days: 90

  # ===================================================================================
  # sca-node - npm audit AND OSV-Scanner, plus a CycloneDX SBOM, per registered project.
  #
  # The matrix is generated from security/scan-targets.yml and always contains every
  # registered project, including ones whose directory does not exist yet. Those run and
  # report an explicit SKIP. A matrix that simply omitted them would be a green tick for
  # a service nobody scanned.
  # ===================================================================================
  sca-node:
    name: sca-node (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.node) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report skip (project not built yet)
        if: ${{ !matrix.scan }}
        run: |
          {
            echo "### sca-node: \`${{ matrix.name }}\` SKIPPED"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| path | \`${{ matrix.path }}\` |"
            echo "| owner | ${{ matrix.owner }} |"
            echo "| arrives in wave | ${{ matrix.wave }} |"
            echo "| registered status | ${{ matrix.status }} |"
            echo ""
            echo "No \`package.json\` at that path yet. This job exists now so the service is"
            echo "scanned by its first commit rather than by a workflow edit somebody has to"
            echo "remember. Registered in \`security/scan-targets.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=sca-node skipped::${{ matrix.name }} not present yet (owner ${{ matrix.owner }}, wave ${{ matrix.wave }})"

      - name: Set up Node
        if: ${{ matrix.scan }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: ${{ matrix.scan }}
        working-directory: ${{ matrix.path }}
        # --ignore-scripts: an npm install script is arbitrary code execution from a
        # transitive dependency, running on a runner that has our source checked out.
        # We are installing in order to audit, not in order to run anything.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "::warning title=No lockfile::${{ matrix.name }} has no package-lock.json; audit results are not reproducible"
            npm install --ignore-scripts --package-lock-only
          fi

      - name: npm audit (fails on high or critical)
        if: ${{ matrix.scan }}
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=high

      - name: Install OSV-Scanner (version + checksum pinned)
        if: ${{ matrix.scan }}
        run: |
          set -euo pipefail
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: OSV-Scanner
        if: ${{ matrix.scan }}
        run: |
          set -euo pipefail
          mkdir -p reports
          osv-scanner scan source --recursive \
            --format json --output "reports/osv-${{ matrix.slug }}.json" \
            "${{ matrix.path }}"
          osv-scanner scan source --recursive "${{ matrix.path }}"

      - name: CycloneDX SBOM
        if: ${{ matrix.scan }}
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
            --output-format JSON \
            --output-file "../sbom-node-${{ matrix.slug }}.cdx.json" \
            --omit dev

      - name: Upload SBOM and reports
        if: ${{ always() && matrix.scan }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-node-${{ matrix.slug }}
          path: |
            sbom-node-*.cdx.json
            reports/
          if-no-files-found: warn
          retention-days: 90

  # ===================================================================================
  # secrets - gitleaks over the working tree AND the full history.
  # History matters: a secret that was committed and then deleted is still in the object
  # database, still fetchable, and still leaked. Scanning only HEAD would call that clean.
  # ===================================================================================
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (version + checksum pinned)
        # Deliberately not gitleaks/gitleaks-action: v2 of that action requires a
        # GITLEAKS_LICENSE for organization-owned repositories, which would make the
        # secret gate depend on a licence key nobody has provisioned yet. A pinned
        # release asset verified against its published SHA-256 has no such dependency
        # and is, if anything, a tighter supply-chain guarantee.
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan working tree
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact --no-banner --verbose \
            --report-format sarif --report-path gitleaks-tree.sarif

      - name: Scan full history (every ref, every commit)
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact --no-banner --verbose \
            --log-opts="--all --full-history" \
            --report-format sarif --report-path gitleaks-history.sarif

      - name: Upload gitleaks reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
          if-no-files-found: warn
          retention-days: 30

  # ===================================================================================
  # hadolint - every Dockerfile in the tree, not only the registered ones. A Dockerfile
  # that is not in the registry is already a failure in `discover`; it should not also be
  # unlinted while somebody argues about whether it counts.
  # ===================================================================================
  hadolint:
    name: hadolint (every Dockerfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hadolint (version + checksum pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/
          hadolint --version

      - name: Lint
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files | grep -iE '(^|/)dockerfile([^/]*)?$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            {
              echo "### hadolint: no Dockerfile in the tree"
              echo ""
              echo "Reported rather than passed quietly. \`security/scan-targets.yml\` expects"
              echo "\`odoo/Dockerfile\` to exist; if it does not, the \`discover\` job has already failed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'Linting %d Dockerfile(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          status=0
          for f in "${files[@]}"; do
            echo "::group::hadolint $f"
            hadolint --config .hadolint.yaml "$f" || status=1
            echo "::endgroup::"
          done
          {
            echo "### hadolint linted ${#files[@]} Dockerfile(s)"
            printf -- '- `%s`\n' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # ===================================================================================
  # container-scan - Trivy over every image this repository builds.
  #
  # Master prompt 5.2: no new image ships unscanned. The matrix comes from
  # security/scan-targets.yml and lists every image the PLAN says will exist. Images that
  # do not exist yet run and report an explicit SKIP with owner and wave. They are never
  # absent from the matrix, because "absent" and "clean" look identical in a job list.
  # ===================================================================================
  container-scan:
    name: container-scan (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report skip (image not built yet)
        if: ${{ !matrix.scan }}
        run: |
          {
            echo "### container-scan: \`${{ matrix.name }}\` SKIPPED"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| dockerfile | \`${{ matrix.dockerfile }}\` |"
            echo "| owner | ${{ matrix.owner }} |"
            echo "| arrives in wave | ${{ matrix.wave }} |"
            echo "| registered status | ${{ matrix.status }} |"
            echo ""
            echo "The Dockerfile does not exist yet. The moment it lands this job scans it -"
            echo "no workflow edit, no request, no window in which the image is unscanned."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=container-scan skipped::${{ matrix.name }} not built yet (owner ${{ matrix.owner }}, wave ${{ matrix.wave }})"

      - name: Build image
        if: ${{ matrix.scan }}
        run: |
          set -euo pipefail
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "bct-scan/${{ matrix.slug }}:${GITHUB_SHA}" \
            "${{ matrix.context }}"

      - name: Trivy - fixable CRITICAL/HIGH (blocking)
        if: ${{ matrix.scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bct-scan/${{ matrix.slug }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          # ignore-unfixed: a base-image CVE with no upstream patch cannot be actioned by
          # this repository. Blocking on it would mean the only way to a green build is a
          # .trivyignore entry, and a policy that forces suppression teaches suppression.
          # Unfixed findings are still collected in the advisory step below and uploaded.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          scanners: vuln,secret,misconfig

      - name: Trivy - full report including unfixed (advisory)
        if: ${{ matrix.scan }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bct-scan/${{ matrix.slug }}:${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: "0"
          format: json
          output: trivy-${{ matrix.slug }}.json
          scanners: vuln,secret,misconfig

      - name: Trivy - CycloneDX SBOM of the built image
        if: ${{ matrix.scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bct-scan/${{ matrix.slug }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-image-${{ matrix.slug }}.cdx.json

      - name: Upload image reports
        if: ${{ always() && matrix.scan }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scan-${{ matrix.slug }}
          path: |
            trivy-*.json
            sbom-image-*.cdx.json
          if-no-files-found: warn
          retention-days: 90

  # ===================================================================================
  # fs-scan - Trivy over the repository itself: dependency manifests, IaC misconfiguration
  # (compose files, Dockerfiles) and secrets. Catches what a per-image scan cannot, such
  # as a container running privileged in docker-compose.yml.
  # ===================================================================================
  fs-scan:
    name: fs-scan (trivy filesystem + config)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          scanners: vuln,secret,misconfig

      - name: Trivy config scan - full report (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"
          format: json
          output: trivy-config.json

      - name: Upload filesystem scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-scan-reports
          path: trivy-config.json
          if-no-files-found: warn
          retention-days: 30

  # ===================================================================================
  # dbt-ci - DISABLED. Phase 3 fills this in.
  #
  # REASON IT IS DISABLED, stated rather than implied:
  #   There is no dbt project in this repository. `analytics/dbt/` does not exist, there
  #   is no profiles.yml, no warehouse to connect to, and no models to compile. Every
  #   command this job would run - `dbt deps`, `dbt build`, `dbt test` - would fail on a
  #   missing directory.
  #
  #   The two dishonest alternatives were both available and both rejected:
  #     * `|| true` on every step, which reports a green dbt gate for a project that does
  #       not exist. Phase 5 would then require a status check that has never verified
  #       anything.
  #     * omitting the job, which loses the record that dbt CI is owed and by whom.
  #
  #   `if: false` makes GitHub render it as "Skipped" on every run: visible in the job
  #   list, impossible to mistake for a pass, and impossible to forget.
  #
  # WHO ENABLES IT: the Data Warehouse agent, in Phase 3, by sending the Security agent a
  # diff request (CI conflict rule, master prompt 2.1 - DWH does not edit this file).
  # Enabling means deleting `if: false` and replacing the placeholder steps with a real
  # `dbt deps && dbt build --target ci && dbt test`, plus the analytics/dbt image entry in
  # security/scan-targets.yml flipped from pending to present.
  # ===================================================================================
  dbt-ci:
    name: dbt-ci (DISABLED until Phase 3)
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISABLED_REASON: >-
        No dbt project exists. analytics/dbt/ arrives in Phase 3 (wave 3, Data Warehouse
        agent). This job is deliberately disabled rather than faked green.
    steps:
      - name: This job is a placeholder and must not report success
        run: |
          echo "dbt-ci is disabled: ${DISABLED_REASON}"
          exit 1

  # ===================================================================================
  # ci-gate - the single required status check.
  #
  # Phase 5 CD depends on THIS job and nothing else. It fails if any job above failed or
  # was cancelled, so a new job added to this workflow tightens the gate automatically
  # and cannot be forgotten in a branch-protection setting nobody remembers to update.
  #
  # `skipped` is tolerated exactly once, for dbt-ci, which is disabled on purpose and
  # documented above. Every other job runs unconditionally.
  # ===================================================================================
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - discover
      - lint
      - sast
      - sca-python
      - sca-node
      - secrets
      - hadolint
      - container-scan
      - fs-scan
      - dbt-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          # dbt-ci is disabled on purpose (see the job above). Nothing else may be skipped.
          permitted_skips = {"dbt-ci"}

          failed, skipped = [], []
          print(f"{'job':<20} result")
          print("-" * 32)
          for name, data in sorted(results.items()):
              outcome = data.get("result")
              print(f"{name:<20} {outcome}")
              if outcome in ("failure", "cancelled"):
                  failed.append(f"{name}={outcome}")
              elif outcome == "skipped" and name not in permitted_skips:
                  skipped.append(name)

          summary = []
          if failed:
              summary.append("FAILED: " + ", ".join(failed))
          if skipped:
              summary.append(
                  "UNEXPECTEDLY SKIPPED: " + ", ".join(skipped) +
                  " - a skipped job is not a passing job; find out why it did not run"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## ci-gate\n\n| job | result |\n|---|---|\n")
              for name, data in sorted(results.items()):
                  fh.write(f"| {name} | {data.get('result')} |\n")
              fh.write("\n**" + ("CI_GATE_FAIL" if summary else "CI_GATE_PASS") + "**\n")
              for line in summary:
                  fh.write(f"\n- {line}\n")

          if summary:
              print("\n".join(summary), file=sys.stderr)
              print("CI_GATE_FAIL", file=sys.stderr)
              sys.exit(1)
          print("CI_GATE_PASS")
          PY
